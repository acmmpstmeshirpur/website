# Builds the site and uploads it to cPanel (public_html) over FTPS on every push to main.
#
# Needs three repository secrets (Settings > Secrets and variables > Actions):
#   FTP_SERVER    FTP host from cPanel > FTP Accounts > Configure FTP Client
#   FTP_USERNAME  e.g. deploy@mpstmeshirpur.hosting.acm.org (its directory must be public_html)
#   FTP_PASSWORD  that FTP account's password
#
# Only files from the build are uploaded or removed, so data/upcoming.json (the
# events saved by the admin page) and admin/.htaccess (its password protection)
# are never touched.

name: Deploy to cPanel

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time; a newer push waits for the running one to finish.
concurrency:
  group: deploy-cpanel
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Skip upload (FTP secrets not set yet)
        if: env.FTP_SERVER == ''
        run: echo "::warning::FTP_SERVER, FTP_USERNAME and FTP_PASSWORD are not set, so the build was not uploaded."

      - name: Upload to cPanel
        if: env.FTP_SERVER != ''
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./dist/
          server-dir: ./
